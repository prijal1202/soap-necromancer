# Render Blueprint: one free Docker web service running the generator and the bundled mock-bank.
# Render sets PORT and RENDER_EXTERNAL_URL itself; the app binds the first and advertises the second
# as the mock-bank address in /api/sample-wsdl.
services:
  - type: web
    name: soap-necromancer
    runtime: docker
    plan: free
    # Pinned: without it the service follows the branch the Blueprint was created from, and a
    # Blueprint sync overwrites a branch changed in the dashboard (render.com/docs/blueprint-spec).
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: MOCKBANK_RESET_INTERVAL
        value: PT30M
