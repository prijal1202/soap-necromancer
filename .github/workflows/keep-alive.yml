# Keeps the Render free instance warm during the judging period (docs/decisions.md 3.4).
# Render spins a free web service down after 15 minutes without inbound traffic; a cold start at
# 0.1 CPU takes about half a minute. 750 free instance hours per workspace per month cover one
# always-on service (a 31-day month is 744 h), as long as it is the only free service.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> RENDER_URL
#        (for example https://soap-necromancer.onrender.com). Unset = the job does nothing.
# GitHub may delay scheduled runs under load, so an occasional cold start can still happen.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not set; nothing to ping."
            exit 0
          fi
          # A cold start can take ~30-90 s, so allow a long single request and a couple of retries.
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            "${RENDER_URL%/}/api/health"
