# Generator web app. Render sets PORT; locally it is 8080.
server.port=${PORT:8080}
spring.application.name=soap-necromancer

# Uploads: a WSDL is small. Anything bigger is rejected before parsing (413).
necromancer.max-upload-bytes=${MAX_UPLOAD_BYTES:2097152}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:2097152}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:2097152}
# Parts up to the upload cap stay in memory: the generator writes nothing to disk, temp files included.
spring.servlet.multipart.file-size-threshold=${MAX_UPLOAD_BYTES:2097152}

# Intake bounds. Each request may hold one upload (<= 2 MB) while it waits for a generation slot,
# so the worker pool, not the semaphore, caps that memory: 16 x 2 MB stays far below the heap.
# Extra connections queue in the accept backlog; slow senders are dropped after 10 s.
server.tomcat.threads.max=${MAX_THREADS:16}
server.tomcat.accept-count=${ACCEPT_COUNT:50}
server.tomcat.connection-timeout=10s

# Per-client limits (RateLimitFilter); 429 with Retry-After beyond them.
necromancer.rate-limit.generate-per-minute=${GENERATE_PER_MINUTE:30}
necromancer.rate-limit.mock-bank-per-minute=${MOCK_BANK_PER_MINUTE:120}
# Concurrent generations allowed at once; extra requests get 503 instead of exhausting 512 MB.
necromancer.max-concurrent=${MAX_CONCURRENT_GENERATIONS:4}

necromancer.queue-wait=${GENERATION_QUEUE_WAIT:5s}
# Output caps (generators Requirement 5.6). The bank WSDL produces about 0.3 MB.
necromancer.max-output-bytes=${MAX_OUTPUT_BYTES:16777216}
necromancer.max-tool-definitions=${MAX_TOOL_DEFINITIONS:20000}

# Public origin of this app. mock-bank's WSDL (and /api/sample-wsdl) advertise <origin>/mock-bank/ws.
# Render sets RENDER_EXTERNAL_URL (https://<service>.onrender.com); PUBLIC_BASE_URL overrides it.
# When both are empty the address comes from the request, X-Forwarded-* headers included.
mockbank.public-base-url=${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
# The shared demo bank returns to its seeded accounts this often (also: POST /mock-bank/reset,
# JSON only, at most once per cooldown).
mockbank.reset-interval=${MOCKBANK_RESET_INTERVAL:PT30M}
mockbank.reset-cooldown=${MOCKBANK_RESET_COOLDOWN:PT30S}

# Render terminates TLS and forwards X-Forwarded-*; trust them so generated URLs say https.
server.forward-headers-strategy=framework

spring.main.banner-mode=off
server.error.include-stacktrace=never
server.error.include-message=never
