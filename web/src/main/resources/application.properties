# Generator web app. Render sets PORT; locally it is 8080.
server.port=${PORT:8080}
spring.application.name=soap-necromancer

# Uploads: a WSDL is small. Anything bigger is rejected before parsing (413).
necromancer.max-upload-bytes=${MAX_UPLOAD_BYTES:2097152}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:2097152}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:2097152}
spring.servlet.multipart.file-size-threshold=0
# Concurrent generations allowed at once; extra requests get 503 instead of exhausting 512 MB.
necromancer.max-concurrent=${MAX_CONCURRENT_GENERATIONS:4}

# mock-bank's WSDL advertises this address when set (e.g. https://<app>.onrender.com/mock-bank/ws);
# otherwise the address of the request that fetched it.
mockbank.public-url=${MOCKBANK_PUBLIC_URL:}

# Render terminates TLS and forwards X-Forwarded-*; trust them so generated URLs say https.
server.forward-headers-strategy=framework

spring.main.banner-mode=off
server.error.include-stacktrace=never
server.error.include-message=never
